<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTSHAND</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            font-family: system-ui, -apple-system, sans-serif;
            color: #eee;
        }
        .container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.72);
            z-index: 10;
            cursor: pointer;
            text-align: center;
            padding: 24px;
        }
        #overlay.hidden { display: none; }
        #overlay h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 600; }
        #overlay p { margin: 0; opacity: 0.55; font-size: 14px; }

        .beat-panels {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 8;
            display: flex;
            gap: 10px;
            padding: 12px;
            pointer-events: none;
        }
        .beat-col {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            pointer-events: auto;
        }
        .beat-col-label {
            flex: 0 0 100%;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.65;
            font-weight: 600;
            padding: 0 1px;
            line-height: 1.2;
        }
        .beat-box {
            position: relative;
            flex: 1 1 0;
            min-width: 44px;
            max-width: 72px;
            height: 44px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.48);
            color: #eee;
            padding: 2px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
            user-select: none;
        }
        .beat-box:hover { border-color: rgba(20, 184, 166, 0.7); }
        .beat-box.active {
            border-color: #14b8a6;
            background: rgba(20, 184, 166, 0.28);
            box-shadow: 0 0 0 1px rgba(20, 184, 166, 0.35), 0 4px 12px rgba(0, 0, 0, 0.35);
        }
        .beat-box.flash {
            transform: scale(1.06);
            background: rgba(20, 184, 166, 0.55);
            box-shadow: 0 0 16px rgba(20, 184, 166, 0.45);
        }
        .beat-box .g-char {
            display: block;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.1;
            font-family: "PingFang HK", "PingFang SC", "Microsoft YaHei", "Noto Sans HK", sans-serif;
        }
        .beat-box .g-say {
            display: block;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.02em;
            opacity: 0.7;
            line-height: 1.15;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .beat-box .g-hint {
            display: none;
        }

        .edit-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            display: flex;
            width: 100%;
            max-height: min(52vh, 360px);
            background: #12121a;
            flex-direction: column;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            transform: translateY(calc(-100% + 22px));
            transition: transform 0.28s ease;
            pointer-events: none;
        }
        .edit-modal.revealed {
            transform: translateY(0);
            pointer-events: auto;
        }
        .edit-sheet {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 10px 12px 14px;
            gap: 10px;
        }
        .edit-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .edit-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #14b8a6;
        }
        .edit-handle {
            width: 44px;
            height: 18px;
            border: 0;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .edit-handle::before {
            content: "";
            width: 40px;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.28);
        }
        .edit-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .edit-field label {
            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            opacity: 0.55;
            font-weight: 700;
        }
        .edit-field input {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.35);
            color: #eee;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 12px;
            outline: none;
        }
        .edit-field input:focus {
            border-color: rgba(20, 184, 166, 0.7);
        }
        .edit-actions {
            display: flex;
            gap: 8px;
        }
        .edit-actions button {
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: #eee;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 12px;
            cursor: pointer;
        }
        .edit-actions button.primary {
            background: rgba(20, 184, 166, 0.22);
            border-color: rgba(20, 184, 166, 0.55);
            color: #14b8a6;
        }
        .edit-actions button:hover {
            border-color: rgba(20, 184, 166, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="overlay">
            <h1>TTSHAND</h1>
            <p>Tap to start</p>
        </div>

        <div class="edit-modal" id="editModal" aria-hidden="true">
            <div class="edit-sheet">
                <div class="edit-top">
                    <div class="edit-title" id="editTitle">Edit</div>
                    <button type="button" class="edit-handle" id="editHandle" aria-label="Close editor"></button>
                </div>
                <div class="edit-field">
                    <label for="editChar">Display</label>
                    <input id="editChar" type="text" maxlength="8" autocomplete="off" />
                </div>
                <div class="edit-field">
                    <label for="editSay">Speak</label>
                    <input id="editSay" type="text" maxlength="24" autocomplete="off" />
                </div>
                <div class="edit-actions">
                    <button type="button" id="editListenBtn">Listen</button>
                    <button type="button" class="primary" id="editDoneBtn">Done</button>
                </div>
            </div>
        </div>

        <div class="beat-panels">
            <div class="beat-col" id="leftBeats">
                <div class="beat-col-label">Left</div>
            </div>
            <div class="beat-col" id="rightBeats">
                <div class="beat-col-label">Right</div>
            </div>
        </div>
    </div>

    <script type="module">
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const overlayEl = document.getElementById('overlay');
        const leftBeatsEl = document.getElementById('leftBeats');
        const rightBeatsEl = document.getElementById('rightBeats');
        const editModal = document.getElementById('editModal');
        const editHandle = document.getElementById('editHandle');
        const editTitle = document.getElementById('editTitle');
        const editChar = document.getElementById('editChar');
        const editSay = document.getElementById('editSay');
        const editListenBtn = document.getElementById('editListenBtn');
        const editDoneBtn = document.getElementById('editDoneBtn');

        const LEFT_SLOTS = [
            { count: 1, gesture: 'Index' },
            { count: 2, gesture: 'Victory' },
            { count: 3, gesture: '3 fingers' },
            { count: 4, gesture: '4 fingers' },
            { count: 5, gesture: 'Palm' }
        ];
        const RIGHT_SLOTS = [
            { count: 0, gesture: 'Fist' },
            { count: 1, gesture: 'Index' },
            { count: 2, gesture: 'Victory' },
            { count: 3, gesture: '3 fingers' },
            { count: 4, gesture: '4 fingers' },
            { count: 5, gesture: 'Palm' }
        ];

        // Speak romanization; display Chinese
        const LEFT_SAY = { 1: 'deal', 2: 'lay', 3: 'hole', 4: 'leng', 5: 'chai' };
        const LEFT_CHARS = { 1: '屌', 2: '你', 3: '好', 4: '靚', 5: '仔' };
        // Right: fist→index→victory→3→4→palm = 你好嗎卜街啦
        const RIGHT_SAY = { 0: 'lay', 1: 'hole', 2: 'mar', 3: 'pork', 4: 'guy', 5: 'la' };
        const RIGHT_CHARS = { 0: '你', 1: '好', 2: '嗎', 3: '卜', 4: '街', 5: '啦' };

        const PALM_LANDMARK_INDICES = [0, 5, 9, 13, 17];
        const HOLD_MS = 180;

        const boxEls = {};
        let editTarget = null; // { side, count }

        let audioCtx = null;
        let femaleVoice = null;
        let maleVoice = null;
        let appStarted = false;
        let lastLeft = null;
        let lastRight = null;
        let pendingLeft = null;
        let pendingRight = null;
        let pendingLeftSince = 0;
        let pendingRightSince = 0;

        function slotKey(side, count) {
            return side + ':' + count;
        }

        function sayMap(side) {
            return side === 'left' ? LEFT_SAY : RIGHT_SAY;
        }

        function charMap(side) {
            return side === 'left' ? LEFT_CHARS : RIGHT_CHARS;
        }

        function ensureAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
            return audioCtx;
        }

        function isFemaleHint(v) {
            const n = (v.name || '').toLowerCase();
            return /female|woman|girl|susan|karen|samantha|zira|hazel|moira|tessa|victoria|google us english female|microsoft.+female/.test(n);
        }

        function isMaleHint(v) {
            const n = (v.name || '').toLowerCase();
            return /male|man|david|mark|daniel|george|ravi|thomas|james|google us english male|microsoft.+male|alex(?!a)/.test(n)
                && !isFemaleHint(v);
        }

        function isEnglishVoice(v) {
            return (v.lang || '').toLowerCase().startsWith('en');
        }

        function langBonus(v) {
            const lang = (v.lang || '').toLowerCase();
            return (lang.startsWith('en-hk') || lang.startsWith('en-gb') ? 2 : 0)
                + (lang.startsWith('en-us') ? 1 : 0);
        }

        function pickEnglishVoices() {
            if (!window.speechSynthesis) return;
            const voices = window.speechSynthesis.getVoices().filter(isEnglishVoice);
            if (!voices.length) {
                femaleVoice = null;
                maleVoice = null;
                return;
            }
            const byScore = (preferFn) => voices.slice().sort((a, b) => {
                const score = (v) => (preferFn(v) ? 6 : 0) + langBonus(v);
                return score(b) - score(a);
            });
            const femaleRanked = byScore(isFemaleHint);
            const maleRanked = byScore(isMaleHint);
            femaleVoice = femaleRanked.find(isFemaleHint) || femaleRanked[0] || null;
            maleVoice = maleRanked.find(isMaleHint)
                || maleRanked.find((v) => v !== femaleVoice)
                || maleRanked[0]
                || null;
        }

        if (window.speechSynthesis) {
            pickEnglishVoices();
            window.speechSynthesis.onvoiceschanged = () => pickEnglishVoices();
        }

        function speakSyllable(roman) {
            ensureAudio();
            if (!window.speechSynthesis || !roman) return;
            window.speechSynthesis.cancel();
            if (!maleVoice && !femaleVoice) pickEnglishVoices();
            const u = new SpeechSynthesisUtterance(roman);
            u.lang = 'en-US';
            u.rate = 1.05;
            const voice = maleVoice || femaleVoice;
            if (voice) {
                u.voice = voice;
                if (voice.lang) u.lang = voice.lang;
            }
            u.pitch = voice && isMaleHint(voice) ? 0.95 : 0.75;
            window.speechSynthesis.speak(u);
        }

        function refreshBox(side, count) {
            const key = slotKey(side, count);
            const el = boxEls[key];
            if (!el) return;
            const charEl = el.querySelector('.g-char');
            const sayEl = el.querySelector('.g-say');
            charEl.textContent = charMap(side)[count] || '·';
            sayEl.textContent = sayMap(side)[count] || '';
        }

        function setActiveBox(side, count) {
            Object.keys(boxEls).forEach((k) => boxEls[k].classList.remove('active'));
            if (side == null || count == null) return;
            const el = boxEls[slotKey(side, count)];
            if (!el) return;
            el.classList.add('active');
            el.classList.remove('flash');
            void el.offsetWidth;
            el.classList.add('flash');
            setTimeout(() => el.classList.remove('flash'), 220);
        }

        function clearActiveSide(side) {
            const prefix = side + ':';
            Object.keys(boxEls).forEach((k) => {
                if (k.startsWith(prefix)) boxEls[k].classList.remove('active');
            });
        }

        function isEditRevealed() {
            return editModal.classList.contains('revealed');
        }

        function collapseEdit() {
            editModal.classList.remove('revealed');
            editModal.setAttribute('aria-hidden', 'true');
            editTarget = null;
        }

        function saveEditFields() {
            if (!editTarget) return;
            const { side, count } = editTarget;
            const char = String(editChar.value || '').trim().slice(0, 8);
            const say = String(editSay.value || '').trim().slice(0, 24);
            if (char) charMap(side)[count] = char;
            if (say) sayMap(side)[count] = say;
            refreshBox(side, count);
        }

        function openEdit(side, count, gesture) {
            editTarget = { side, count, gesture };
            editTitle.textContent = (side === 'left' ? 'Left' : 'Right') + ' · ' + gesture;
            editChar.value = charMap(side)[count] || '';
            editSay.value = sayMap(side)[count] || '';
            editModal.classList.add('revealed');
            editModal.setAttribute('aria-hidden', 'false');
            setTimeout(() => editChar.focus(), 50);
        }

        function buildBoxes() {
            function addSlot(parent, side, slot) {
                const key = slotKey(side, slot.count);
                const box = document.createElement('button');
                box.type = 'button';
                box.className = 'beat-box';
                box.dataset.key = key;
                box.title = slot.gesture + ' — tap to edit';
                box.innerHTML =
                    '<span class="g-char"></span>' +
                    '<span class="g-say"></span>' +
                    '<span class="g-hint">' + slot.gesture + '</span>';
                box.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isEditRevealed() && editTarget && editTarget.side === side && editTarget.count === slot.count) {
                        saveEditFields();
                        collapseEdit();
                        return;
                    }
                    saveEditFields();
                    openEdit(side, slot.count, slot.gesture);
                });
                parent.appendChild(box);
                boxEls[key] = box;
                refreshBox(side, slot.count);
            }
            LEFT_SLOTS.forEach((slot) => addSlot(leftBeatsEl, 'left', slot));
            RIGHT_SLOTS.forEach((slot) => addSlot(rightBeatsEl, 'right', slot));
        }

        editHandle.addEventListener('click', (e) => {
            e.stopPropagation();
            saveEditFields();
            collapseEdit();
        });
        editDoneBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            saveEditFields();
            collapseEdit();
        });
        editListenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const say = String(editSay.value || '').trim();
            if (say) speakSyllable(say);
        });
        editChar.addEventListener('change', saveEditFields);
        editSay.addEventListener('change', saveEditFields);
        editChar.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); saveEditFields(); editSay.focus(); }
        });
        editSay.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); saveEditFields(); collapseEdit(); }
        });

        function isFingerExtended(landmarks, tip, pip, mcp) {
            return landmarks[tip].y < landmarks[pip].y - 0.02
                && landmarks[pip].y < landmarks[mcp].y + 0.04;
        }

        function isThumbExtended(landmarks, isLeft) {
            const wrist = landmarks[0];
            const tip = landmarks[4];
            const ip = landmarks[3];
            const mcp = landmarks[2];
            const tipDist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
            const ipDist = Math.hypot(ip.x - wrist.x, ip.y - wrist.y);
            const outward = isLeft ? (tip.x > mcp.x + 0.02) : (tip.x < mcp.x - 0.02);
            return tipDist > ipDist * 1.05 && (outward || tipDist > Math.hypot(mcp.x - wrist.x, mcp.y - wrist.y) * 1.1);
        }

        function countFingers(landmarks, isLeft) {
            if (!landmarks || landmarks.length < 21) return 0;
            let n = 0;
            if (isThumbExtended(landmarks, isLeft)) n++;
            if (isFingerExtended(landmarks, 8, 6, 5)) n++;
            if (isFingerExtended(landmarks, 12, 10, 9)) n++;
            if (isFingerExtended(landmarks, 16, 14, 13)) n++;
            if (isFingerExtended(landmarks, 20, 18, 17)) n++;
            return n;
        }

        function gestureFallbackCount(gestureName, landmarks) {
            if (gestureName === 'Closed_Fist') return 0;
            if (gestureName === 'Pointing_Up') return 1;
            if (gestureName === 'Victory') return 2;
            if (gestureName === 'Open_Palm') return 5;
            if (gestureName === 'ILoveYou') return 3;
            if (landmarks) {
                const tipY = (i) => landmarks[i].y;
                const three = tipY(8) < tipY(6) && tipY(12) < tipY(10) && tipY(16) < tipY(14)
                    && tipY(4) >= tipY(3) - 0.05 && tipY(20) >= tipY(18) - 0.05;
                if (three) return 3;
                const four = tipY(8) < tipY(6) && tipY(12) < tipY(10) && tipY(16) < tipY(14) && tipY(20) < tipY(18)
                    && tipY(4) >= tipY(3) - 0.05;
                if (four) return 4;
            }
            return null;
        }

        function resolveFingerCount(gestureName, landmarks, isLeft) {
            if (gestureName === 'Closed_Fist') return 0;
            if (gestureName === 'Pointing_Up') return 1;
            if (gestureName === 'Victory') return 2;
            if (gestureName === 'Open_Palm') return 5;

            const counted = countFingers(landmarks, isLeft);
            if (counted === 0) return 0;
            if (counted === 3 || counted === 4) return counted;
            if (counted === 1 || counted === 2 || counted === 5) return counted;
            return gestureFallbackCount(gestureName, landmarks);
        }

        function sideHasCount(side, count) {
            if (count == null) return false;
            if (side === 'right') return count >= 0 && count <= 5;
            return count >= 1 && count <= 5;
        }

        function maybeSpeak(side, count) {
            const chars = charMap(side);
            const say = sayMap(side);
            const last = side === 'left' ? lastLeft : lastRight;
            const pending = side === 'left' ? pendingLeft : pendingRight;
            const since = side === 'left' ? pendingLeftSince : pendingRightSince;
            const now = performance.now();

            if (!sideHasCount(side, count)) {
                if (side === 'left') pendingLeft = null;
                else pendingRight = null;
                clearActiveSide(side);
                return;
            }

            const hanzi = chars[count];
            const roman = say[count];
            if (!hanzi || !roman) {
                if (side === 'left') pendingLeft = null;
                else pendingRight = null;
                clearActiveSide(side);
                return;
            }

            if (count === last) {
                if (side === 'left') pendingLeft = null;
                else pendingRight = null;
                const el = boxEls[slotKey(side, count)];
                if (el) el.classList.add('active');
                return;
            }

            if (count !== pending) {
                if (side === 'left') { pendingLeft = count; pendingLeftSince = now; }
                else { pendingRight = count; pendingRightSince = now; }
                return;
            }

            if (now - since < HOLD_MS) return;

            if (side === 'left') { lastLeft = count; pendingLeft = null; }
            else { lastRight = count; pendingRight = null; }

            setActiveBox(side, count);
            speakSyllable(roman);
        }

        function updateCanvasSize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', updateCanvasSize);
        updateCanvasSize();

        async function initWebcam() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
            });
            videoElement.srcObject = stream;
            return new Promise((resolve) => {
                videoElement.onloadedmetadata = () => {
                    updateCanvasSize();
                    resolve(videoElement);
                };
            });
        }

        function drawLandmarks(landmarks, isLeft) {
            const w = canvasElement.width;
            const h = canvasElement.height;
            const lineWidth = Math.max(2, Math.min(5, Math.min(w, h) / 300));
            const pointSize = Math.max(2, Math.min(8, Math.min(w, h) / 250));
            const connections = [
                [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
            ];
            const handColor = isLeft ? 'rgba(140, 190, 255, 0.88)' : 'rgba(255, 190, 140, 0.88)';
            canvasCtx.lineWidth = lineWidth;
            canvasCtx.strokeStyle = handColor;
            connections.forEach(([i, j]) => {
                canvasCtx.beginPath();
                canvasCtx.moveTo(landmarks[i].x * w, landmarks[i].y * h);
                canvasCtx.lineTo(landmarks[j].x * w, landmarks[j].y * h);
                canvasCtx.stroke();
            });
            landmarks.forEach((lm) => {
                canvasCtx.fillStyle = handColor;
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * w, lm.y * h, pointSize * 1.2, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function drawLabelOnPalm(landmarks, text, color) {
            if (!landmarks || !text) return;
            const w = canvasElement.width;
            const h = canvasElement.height;
            const palm = PALM_LANDMARK_INDICES.reduce((acc, idx) => ({
                x: acc.x + landmarks[idx].x,
                y: acc.y + landmarks[idx].y
            }), { x: 0, y: 0 });
            const n = PALM_LANDMARK_INDICES.length;
            const cx = (palm.x / n) * w;
            const cy = (palm.y / n) * h;
            const fontSize = Math.min(44, Math.max(22, Math.min(w, h) * 0.065));
            canvasCtx.font = `700 ${fontSize}px "PingFang HK", "PingFang SC", "Microsoft YaHei", "Noto Sans HK", system-ui, sans-serif`;
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'middle';
            canvasCtx.fillStyle = color || 'rgba(255, 255, 255, 0.95)';
            canvasCtx.save();
            canvasCtx.translate(cx, cy);
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-cx, -cy);
            canvasCtx.fillText(text, cx, cy);
            canvasCtx.restore();
        }

        async function startMediaPipe() {
            const mpVision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
            const { GestureRecognizer, FilesetResolver } = mpVision;
            const vision = await FilesetResolver.forVisionTasks(
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
            );
            const gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task'
                },
                runningMode: 'VIDEO',
                numHands: 2
            });

            await initWebcam();

            let lastVideoTime = -1;
            function processFrame() {
                if (videoElement.readyState < 2) {
                    requestAnimationFrame(processFrame);
                    return;
                }
                const now = videoElement.currentTime * 1000;
                if (now !== lastVideoTime) {
                    lastVideoTime = now;
                    const result = gestureRecognizer.recognizeForVideo(videoElement, now);
                    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                    let leftCount = null;
                    let rightCount = null;
                    let leftLm = null;
                    let rightLm = null;

                    if (result.landmarks && result.landmarks.length > 0) {
                        for (let i = 0; i < result.landmarks.length; i++) {
                            const landmarks = result.landmarks[i];
                            const handedness = result.handedness && result.handedness[i] && result.handedness[i][0];
                            const isLeft = handedness ? handedness.categoryName === 'Left' : (i === 0);
                            drawLandmarks(landmarks, isLeft);

                            const gesture = result.gestures && result.gestures[i] && result.gestures[i][0];
                            const name = gesture ? gesture.categoryName : 'None';
                            const count = resolveFingerCount(name, landmarks, isLeft);

                            if (isLeft) {
                                leftCount = count;
                                leftLm = landmarks;
                            } else {
                                rightCount = count;
                                rightLm = landmarks;
                            }
                        }
                    }

                    maybeSpeak('left', leftCount);
                    maybeSpeak('right', rightCount);

                    if (leftLm && leftCount >= 1 && leftCount <= 5) {
                        drawLabelOnPalm(leftLm, LEFT_CHARS[leftCount], 'rgba(180, 220, 255, 0.98)');
                    }
                    if (rightLm && rightCount != null && rightCount >= 0 && rightCount <= 5) {
                        drawLabelOnPalm(rightLm, RIGHT_CHARS[rightCount], 'rgba(255, 210, 170, 0.98)');
                    }
                }
                requestAnimationFrame(processFrame);
            }
            processFrame();
        }

        async function startApp() {
            if (appStarted) return;
            appStarted = true;
            overlayEl.classList.add('hidden');
            ensureAudio();
            try {
                await startMediaPipe();
            } catch (e) {
                console.error(e);
            }
        }

        buildBoxes();
        overlayEl.addEventListener('click', startApp);
    </script>
</body>
</html>
